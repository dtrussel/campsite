# Checks, builds and packages Campsite.
#   push / pull request: tools/check.sh, then tools/export_playtest.sh;
#                        the zips are uploaded as a run artifact.
#   tag v*:              the same, then a GitHub Release with the zips.
# Art is not rebuilt here: the baked assets are committed (see art/).
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Godot version
        id: godot
        run: |
          version="$(cat tools/godot_version.txt)"          # e.g. 4.3.stable
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=${version%.*}-${version##*.}" >> "$GITHUB_OUTPUT"   # 4.3-stable
          echo "project=$(sed -n 's/^config\/version="\(.*\)"/\1/p' game/project.godot)" >> "$GITHUB_OUTPUT"

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ steps.godot.outputs.version }}
          key: godot-${{ steps.godot.outputs.version }}-linux-windows-v1

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          RELEASE: ${{ steps.godot.outputs.release }}
          VERSION: ${{ steps.godot.outputs.version }}
        run: |
          base="https://github.com/godotengine/godot/releases/download/$RELEASE"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${RELEASE}_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${RELEASE}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/$VERSION
          mkdir -p "$dest"
          # Only the templates the presets use (the full set is ~1 GB).
          unzip -q -j /tmp/templates.tpz templates/version.txt templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe -d "$dest"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Checks (import, validate, smoke run)
        run: GODOT="$HOME/godot/godot" tools/check.sh

      - name: Export and package (Linux self-test, Windows)
        run: GODOT="$HOME/godot/godot" tools/export_playtest.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Campsite-${{ steps.godot.outputs.project }}
          path: |
            build/Campsite-*-windows.zip
            build/Campsite-*-linux.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the game version
        run: |
          project="$(sed -n 's/^config\/version="\(.*\)"/\1/p' game/project.godot)"
          if [[ "${GITHUB_REF_NAME}" != "v$project" ]]; then
            echo "::warning::Tag ${GITHUB_REF_NAME} does not match config/version v$project in game/project.godot"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
